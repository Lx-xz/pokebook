# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
version=1.0.0
group=io.github.lxxz

# Dependencies
fabric_api_version=0.116.17+1.21.1

# O plugin do Kotlin não é para escrever Kotlin: é o que liga o remapeamento dos
# METADADOS do Kotlin no Loom. Sem ele o Cobblemon derruba o jogo em dev com
# ClassNotFoundException: net.minecraft.class_2960 (o nome intermediary de Identifier),
# porque a reflexão do Kotlin lê nomes de classe de strings, que o remapeamento de
# bytecode não alcança. Versão fixada pela MDK oficial do Cobblemon.
kotlin_version=2.2.20

# Cobblemon. O esquema de versão é <versaoCobblemon>+<versaoMinecraft>.
# Fixado de propósito: a API do Cobblemon quebra entre versões menores.
cobblemon_version=1.8.0+1.21.1

# Simple Voice Chat. As duas versões são de propósito diferentes: compila-se contra a
# API mais ANTIGA que tenha o necessário e roda-se com o mod mais NOVO -- é a direção
# suportada, e a recomendação do próprio autor do SVC. O contrário quebra.
voicechat_api_version=2.5.31
voicechat_mod_version=fabric-1.21.1-2.6.10
